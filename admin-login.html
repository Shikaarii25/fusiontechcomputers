<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090e"><title>Fusiontech Cloud Admin Login</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/cloud.css"><link rel="stylesheet" href="assets/css/admin.css"><link rel="stylesheet" href="assets/css/cloud-admin.css"></head><body class="login"><canvas id="starsCanvas" aria-hidden="true"></canvas><div class="loginbox"><a class="brand" href="index.html"><i>FT</i><span>FUSIONTECH<small>CLOUD ADMIN V4</small></span></a><h1>Welcome back</h1><p>Secure cloud control center for your Fusiontech website and business operations.</p><form id="loginForm" class="stack"><label>Email<input type="email" name="email" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn red wide">Sign in</button><div id="loginStatus" class="flash err" hidden></div></form><p class="install-note">First login: set <code>ADMIN_EMAIL</code>, <code>ADMIN_PASSWORD</code> and <code>SESSION_SECRET</code> in Netlify. The first successful login creates the server-side admin record.</p><a class="back" href="index.html">← Back to website</a></div><script src="assets/js/app-cloud.js"></script><script>
(async()=>{const f=document.getElementById('loginForm'),s=document.getElementById('loginStatus');try{await window.FT.getCsrf();}catch(e){s.hidden=false;s.textContent=e.message}f.addEventListener('submit',async e=>{e.preventDefault();s.hidden=true;try{const r=await window.FT.api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f).entries()))});location.href='admin.html#dashboard';}catch(err){s.hidden=false;s.textContent=err.message;}})})();
</script></body></html>
